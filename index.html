<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anatomy 3D Viewer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="app">
    <!-- Header -->
    <header id="header">
      <h1>Anatomy Lab 3D Viewer</h1>
      <p class="subtitle">University of Waterloo</p>
    </header>

    <!-- Body: sidebar + viewer -->
    <div id="body">
      <!-- Left sidebar: model list -->
      <aside id="sidebar">
        <p class="sidebar-label">Regions</p>
        <nav id="region-selector">
          <button class="region-btn" data-region="shoulder">
            <span class="region-label">Shoulder</span>
          </button>
          <button class="region-btn" data-region="pelvis">
            <span class="region-label">Pelvis</span>
          </button>
        </nav>

        <!-- Background only (shown once a model is loaded) -->
        <div id="display-controls" class="hidden">
          <p class="sidebar-label">Background</p>
          <div id="bg-swatches">
            <button class="bg-swatch active" data-bg="dark" title="Dark"></button>
            <button class="bg-swatch" data-bg="gray" title="Gray"></button>
            <button class="bg-swatch" data-bg="light" title="Light"></button>
          </div>
        </div>
      </aside>

      <!-- Viewer area -->
      <main id="viewer-container">
        <!-- Empty state (no model loaded) -->
        <div id="empty-state">
          <div id="empty-icon">⊹</div>
          <p id="empty-title">Select a region to begin</p>
          <p id="empty-sub">Choose a model from the list on the left.</p>
        </div>

        <!-- Loading overlay -->
        <div id="loading-overlay" class="hidden">
          <div id="loading-box">
            <div id="loading-spinner"></div>
            <p id="loading-text">Loading model…</p>
            <div id="progress-bar-track">
              <div id="progress-bar-fill"></div>
            </div>
          </div>
        </div>

        <!-- Three.js canvas -->
        <canvas id="viewer-canvas"></canvas>

        <!-- Top-right toolbar: reset button + orientation gizmo -->
        <div id="viewer-toolbar" class="hidden">
          <button id="reset-btn" title="Reset view">&#8635; Reset View</button>
          <canvas id="gizmo-canvas" title="Click a face to snap to that view"></canvas>
        </div>

        <!-- Controls hint -->
        <div id="controls-hint" class="hidden">
          <span>Drag to rotate</span>
          <span class="divider">·</span>
          <span>Scroll to zoom</span>
          <span class="divider">·</span>
          <span>Right-drag to pan</span>
        </div>
      </main>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "./js/three.module.min.js",
        "three/addons/": "./js/"
      }
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
